version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: sweety-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sweety}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sweety}
      POSTGRES_DB: ${POSTGRES_DB:-sweety}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sweety -d sweety"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

