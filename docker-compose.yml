version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: sweety-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sweety}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sweety}
      POSTGRES_DB: ${POSTGRES_DB:-sweety}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sweety -d sweety"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: sweety-api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgres://${POSTGRES_USER:-sweety}:${POSTGRES_PASSWORD:-sweety}@db:5432/${POSTGRES_DB:-sweety}
      JWT_SECRET: ${JWT_SECRET:-sweety-production-super-secret-jwt-key-2026!}
      JWT_EXPIRES_IN: 1h
      BCRYPT_ROUNDS: 12
      CLIENT_ORIGIN: http://localhost:80
      APP_TIMEZONE: Asia/Kolkata
    ports:
      - "5000:5000"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: sweety-client
    restart: always
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  postgres_data:
